name: CI

# Builds the debug APK and runs the unit tests on every pull request and on
# every push to main, so a change is only merged after it has actually compiled.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The wrapper script is not committed, and generating it configures the
      # project (downloading the plugin classpath) for no benefit here — so use
      # the Gradle 8.9 that setup-gradle already put on PATH.
      # Maven Central redirects a few Kotlin artifacts to GitHub Releases, which
      # intermittently answers 504. A failed download is not a failed build, so
      # each Gradle step gets one retry before it is treated as a real failure.
      - name: Assemble debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug && exit 0
          echo "::warning::assembleDebug failed, retrying once (flaky artifact download?)"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Unit tests
        run: |
          gradle --no-daemon --stacktrace testDebugUnitTest && exit 0
          echo "::warning::testDebugUnitTest failed, retrying once (flaky artifact download?)"
          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
