name: Release

# Builds a signed release and publishes it as a GitHub Release.
# Rule 3: publish only what actually builds, always as an installable update
# over the previous version (same package ID, same signing key).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: test -f gradlew || gradle wrapper --gradle-version 8.9

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing — cannot sign a release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.p12

      - name: Build signed release
        env:
          KEYSTORE_PATH: release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify the APK is signed with the release key
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Upload build outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Remove keystore from runner
        if: always()
        run: rm -f release.p12
